[project]
name = "g4-backend"
version = "0.1.0"
description = "個人大總管 APP 後端"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13",
  "psycopg[binary]>=3.2,<4",
  "anthropic>=1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["real_ai: 呼叫真實 AI 供應商，會產生費用；需 AI_PROVIDER=anthropic 與 ANTHROPIC_API_KEY"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]   # 測試使用 assert

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# 測試：假 token、SQL 種子字串、較長的斷言
"tests/**" = ["S105", "S106", "S608", "E501"]
